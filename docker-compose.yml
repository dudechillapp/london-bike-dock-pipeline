services:
  warehouse:
    image: timescale/timescaledb-ha:pg16
    container_name: bikes-warehouse
    environment:
      POSTGRES_USER: bikes
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bikes
    ports: ["5432:5432"]
    volumes: ["pgdata:/home/postgres/pgdata/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikes -d bikes"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
